[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gesit"
version = "1.0.0"
description = "Fast multi-connection download manager with browser integration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PySide6", "httpx"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
socks = ["httpx[socks]"]
dev = ["pytest", "pytest-asyncio"]

[project.gui-scripts]
gesit = "gesit.gui.app:main_cli"

[project.scripts]
gesit-native-host = "gesit.native_host:main"

[tool.setuptools]
packages = ["gesit", "gesit.core", "gesit.engine", "gesit.gui"]
